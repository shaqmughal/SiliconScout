name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Build
        run: swift build -c release --target SiliconScoutApp

      - name: Package .app bundle
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          rm -rf SiliconScout.app "SiliconScout-$VERSION.zip"
          mkdir -p SiliconScout.app/Contents/MacOS
          mkdir -p SiliconScout.app/Contents/Resources

          APP_BIN="$(find .build -type f -name 'SiliconScoutApp' -perm -111 | head -n 1)"
          if [ -z "$APP_BIN" ]; then
            echo "Could not find built SiliconScoutApp binary"
            find .build -type f | sort
            exit 1
          fi

          if [ ! -f packaging/Info.plist ]; then
            echo "Missing packaging/Info.plist"
            exit 1
          fi

          cp "$APP_BIN" SiliconScout.app/Contents/MacOS/SiliconScout
          chmod +x SiliconScout.app/Contents/MacOS/SiliconScout

          sed "s/{{VERSION}}/$VERSION/g" packaging/Info.plist \
            > SiliconScout.app/Contents/Info.plist

          # Build .icns from the committed PNG assets
          ICONSET=AppIcon.iconset
          PNGS=Sources/SiliconScoutApp/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$ICONSET"
          cp "$PNGS/AppIcon-16.png"   "$ICONSET/icon_16x16.png"
          cp "$PNGS/AppIcon-32.png"   "$ICONSET/icon_16x16@2x.png"
          cp "$PNGS/AppIcon-32.png"   "$ICONSET/icon_32x32.png"
          cp "$PNGS/AppIcon-64.png"   "$ICONSET/icon_32x32@2x.png"
          cp "$PNGS/AppIcon-128.png"  "$ICONSET/icon_128x128.png"
          cp "$PNGS/AppIcon-256.png"  "$ICONSET/icon_128x128@2x.png"
          cp "$PNGS/AppIcon-256.png"  "$ICONSET/icon_256x256.png"
          cp "$PNGS/AppIcon-512.png"  "$ICONSET/icon_256x256@2x.png"
          cp "$PNGS/AppIcon-512.png"  "$ICONSET/icon_512x512.png"
          cp "$PNGS/AppIcon-1024.png" "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o SiliconScout.app/Contents/Resources/AppIcon.icns

          test -f SiliconScout.app/Contents/Info.plist
          test -f SiliconScout.app/Contents/MacOS/SiliconScout
          test -f SiliconScout.app/Contents/Resources/AppIcon.icns

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent SiliconScout.app "SiliconScout-$VERSION.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SiliconScout-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
